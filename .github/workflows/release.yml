name: Build & Release

# 触发条件：
#   1) push tag v*：发 Release（推荐路径，避免和 main push 竞态）
#   2) 手动在 Actions 页面点 "Run workflow" 也能跑一次（用于补救/重发）
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '要发布的版本号（不带 v 前缀，例如 1.9.72）。留空则用 manifest.json 当前版本。'
        required: false
        default: ''

permissions:
  contents: write   # 允许 GITHUB_TOKEN 创建 release / 推 tag

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 拉全部历史，便于读 changelog

      - name: Resolve version
        id: version
        run: |
          # 优先用手动输入；否则从 tag 取；否则从 manifest 取
          INPUT="${{ github.event.inputs.version }}"
          if [ -n "$INPUT" ]; then
            VERSION="$INPUT"
            echo "📌 Using manual input version: v$VERSION"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            echo "🏷  Using tag version: v$VERSION"
          else
            VERSION=$(grep '"version"' qlabel-booster/manifest.json | head -1 | sed -E 's/.*"version": *"([^"]+)".*/\1/')
            echo "📦 Using manifest version: v$VERSION"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build userscript
        run: |
          cd qlabel-booster-userscript
          chmod +x build-userscript.sh
          ./build-userscript.sh
          ls -la dist/

      - name: Build extension zip
        run: |
          cd qlabel-booster
          chmod +x build.sh
          ./build.sh
          ls -la dist/

      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # 提取 CHANGELOG.md 里 "## [x.y.z]" 段（直到下一个 "## [" 或文件末尾）
          NOTES=$(awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { found=1; print; next }
            found && /^## \[/ { exit }
            found { print }
          ' qlabel-booster/CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            NOTES="QLabel Booster v$VERSION"
          fi
          # 保存到文件，避免特殊字符引起 GITHUB_OUTPUT 解析问题
          echo "$NOTES" > /tmp/release_notes.md
          echo "📝 Changelog extracted ($(wc -l < /tmp/release_notes.md) lines)"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: QLabel Booster v${{ steps.version.outputs.version }}
          body_path: /tmp/release_notes.md
          draft: false
          prerelease: false
          # 允许同名 release 已存在时覆盖（用于 workflow_dispatch 补救）
          make_latest: true
          files: |
            qlabel-booster-userscript/dist/qlabel-booster.user.js
            qlabel-booster/dist/qlabel-booster-v${{ steps.version.outputs.version }}.zip
            qlabel-booster/dist/qlabel-booster-v${{ steps.version.outputs.version }}-macos.zip
            qlabel-booster/dist/qlabel-booster-v${{ steps.version.outputs.version }}-windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

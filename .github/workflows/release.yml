name: Build & Release

# 触发条件：
#   1) push 到 main：检查版本号是否变化，变了就发 Release
#   2) 手动在 Actions 页面点 "Run workflow" 也能跑一次（用于补救/重发）
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # 允许 GITHUB_TOKEN 创建 release / 推 tag

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 拉全部历史，便于打 tag

      - name: Read version from manifest.json
        id: version
        run: |
          VERSION=$(grep '"version"' qlabel-booster/manifest.json | head -1 | sed -E 's/.*"version": *"([^"]+)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Version: v$VERSION"

      - name: Check if tag already exists
        id: check_tag
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "tag_exists=true" >> $GITHUB_OUTPUT
            echo "⚠️ Tag $TAG already exists, will skip release"
          else
            echo "tag_exists=false" >> $GITHUB_OUTPUT
            echo "✅ Tag $TAG is new, will create release"
          fi

      - name: Build userscript
        if: steps.check_tag.outputs.tag_exists == 'false'
        run: |
          cd qlabel-booster-userscript
          chmod +x build-userscript.sh
          ./build-userscript.sh
          ls -la dist/

      - name: Build extension zip
        if: steps.check_tag.outputs.tag_exists == 'false'
        run: |
          cd qlabel-booster
          chmod +x build.sh
          ./build.sh
          ls -la dist/

      - name: Extract changelog for this version
        if: steps.check_tag.outputs.tag_exists == 'false'
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # 提取 CHANGELOG.md 里 "## [x.y.z]" 段（直到下一个 "## [" 或文件末尾）
          NOTES=$(awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { found=1; print; next }
            found && /^## \[/ { exit }
            found { print }
          ' qlabel-booster/CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            NOTES="QLabel Booster v$VERSION"
          fi
          # 保存到文件，避免特殊字符引起 GITHUB_OUTPUT 解析问题
          echo "$NOTES" > /tmp/release_notes.md
          echo "📝 Changelog extracted ($(wc -l < /tmp/release_notes.md) lines)"

      - name: Create Release
        if: steps.check_tag.outputs.tag_exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: QLabel Booster v${{ steps.version.outputs.version }}
          body_path: /tmp/release_notes.md
          draft: false
          prerelease: false
          files: |
            qlabel-booster-userscript/dist/qlabel-booster.user.js
            qlabel-booster/dist/qlabel-booster-v${{ steps.version.outputs.version }}.zip
            qlabel-booster/dist/qlabel-booster-v${{ steps.version.outputs.version }}-macos.zip
            qlabel-booster/dist/qlabel-booster-v${{ steps.version.outputs.version }}-windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Skipped notice
        if: steps.check_tag.outputs.tag_exists == 'true'
        run: |
          echo "::notice::Tag v${{ steps.version.outputs.version }} 已存在，本次不发布。"
          echo "如果需要重新发，先在 GitHub 上删除该 tag 和 release，再 push 一次。"
